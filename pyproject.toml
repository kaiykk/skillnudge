[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillnudge"
version = "0.1.1"
description = "Local-first capability intervention advisor for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Kai" },
]
dependencies = []

[project.scripts]
skillnudge = "skillnudge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillnudge = ["data/*.json"]
