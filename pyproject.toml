[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillnudge"
version = "0.2.0"
description = "Traceable Agent Session to Skill evolution control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Kai" },
]
dependencies = []

[project.scripts]
skillnudge = "skillnudge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
